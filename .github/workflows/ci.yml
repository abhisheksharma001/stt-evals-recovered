name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    # T-77: a throwaway Postgres for the route-level tests. Schema is pushed
    # by drizzle-kit right before they run; nothing else in the job uses it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stt_evals_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stt_evals_test
    steps:
      - uses: actions/checkout@v4

      # Must match the pnpm major that wrote pnpm-lock.yaml (lockfileVersion
      # 9.0 written by pnpm 11): a mismatch fails `--frozen-lockfile` before
      # any step runs (T-53).
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root script chains lib typecheck (tsc --build) + per-package typecheck.
      - name: Typecheck
        run: pnpm run typecheck

      # T-75: no import cycles among api-server modules (a cycle only "works"
      # by luck of evaluation order and breaks silently on the next refactor).
      - name: Check import cycles (api-server)
        run: node scripts/check-import-cycles.mjs artifacts/api-server/src

      # T-120: every backticked repo path in the live docs exists.
      - name: Check doc paths
        run: bash scripts/check-doc-paths.sh

      # T-148: the spec and the router declare the same endpoints. A spec
      # entry with no route generates a client function that 404s; a route
      # with no spec entry has no generated validator.
      - name: Check API routes match the spec
        run: node scripts/check-api-routes.mjs

      # T-156: every success payload goes through respondJson, the only form
      # the compiler can hold against the contract -- res.json(Schema.parse(v))
      # typechecks v against nothing, which is how T-136 shipped a 500.
      - name: Check success responses go through respondJson
        run: node scripts/check-response-edge.mjs

      # Offline by design: scoring edge cases + provider response-parser
      # fixtures. No API keys required or used.
      - name: Unit tests (scoring)
        run: pnpm --filter @workspace/scoring test

      - name: Unit tests (stt-providers parsers)
        run: pnpm --filter @workspace/stt-providers test

      # T-121: pure logic under the web app's src/lib (chip buckets, catalog
      # age, retention state). Node environment; no DOM, no API.
      - name: Unit tests (stt-benchmark lib)
        run: pnpm --filter @workspace/stt-benchmark test

      # T-26: judge contract. Offline: pins baml_src/judge.baml + JUDGE_MODEL
      # to a fixture recorded by running the judge locally against the saved
      # scans and human adjudications. A prompt edit without a re-record, or
      # a re-record below the floors, fails here. No OpenAI key in CI.
      - name: Judge contract tests (api-server)
        run: pnpm --filter @workspace/api-server test

      # T-77: route-level tests for the three riskiest endpoints (T-27
      # upsert, bulk launch twice, verdicts/verdict.html) with supertest
      # against the service container above. Offline: the seeded call has
      # no audio, so no provider is ever called.
      - name: Push schema to the throwaway database
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Route tests (api-server, throwaway database)
        run: pnpm --filter @workspace/api-server run test:integration

      - name: Build web app
        run: pnpm --filter @workspace/stt-benchmark run build

      - name: Build API server bundle
        run: pnpm --filter @workspace/api-server run build
