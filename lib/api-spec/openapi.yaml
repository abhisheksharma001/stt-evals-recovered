openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API contract for the STT Benchmark Command Center
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: benchmark
    description: Benchmark corpus, providers, scoring runs, and governance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /benchmark/dashboard:
    get:
      operationId: getBenchmarkDashboard
      tags: [benchmark]
      summary: Get benchmark readiness and decision summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkDashboard"
  /benchmark/calls:
    get:
      operationId: listBenchmarkCalls
      tags: [benchmark]
      summary: List approved benchmark calls
      parameters:
        - name: vertical
          in: query
          schema:
            $ref: "#/components/schemas/Vertical"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CallStatus"
      responses:
        "200":
          description: Benchmark calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkCall"
    post:
      operationId: createBenchmarkCall
      tags: [benchmark]
      summary: Register a de-identified call in the benchmark corpus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkCallInput"
      responses:
        "201":
          description: Created benchmark call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCall"
  /benchmark/calls/disagreement:
    get:
      operationId: getCallDisagreement
      tags: [benchmark]
      summary: T-85 -- one number per call, how much the providers disagreed on it (sum of peer flag counts over ok scored cells), most disagreement first. Scoped to one bulk when bulkId is given, else every benchmark run. Calls with no scored cell are absent, never zero.
      parameters:
        - name: bulkId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Calls ordered worst-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDisagreement"
  /benchmark/words-to-watch:
    get:
      operationId: getWordsToWatch
      tags: [benchmark]
      summary: T-87 -- words that keep splitting the providers, grouped by the plurality reading, most calls first. One bulk when bulkId is given; otherwise all-time (T-92 -- every finished bulk, the latest run per call). Scoped to one assistant when assistantId is given. Says where providers split; never which reading is right (no human judge, T-86).
      parameters:
        - name: bulkId
          in: query
          schema:
            type: string
        - name: assistantId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Words to watch, most calls first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordsToWatch"
        "404":
          description: Bulk not found
  /benchmark/calls/{callId}:
    get:
      operationId: getBenchmarkCall
      tags: [benchmark]
      summary: One call by id (T-51) -- reading a single call no longer means fetching the whole corpus
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCall"
        "404":
          description: Call not found
    patch:
      operationId: updateBenchmarkCall
      tags: [benchmark]
      summary: Update gold-reference readiness and benchmark call metadata
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkCallUpdate"
      responses:
        "200":
          description: Updated benchmark call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCall"
  /benchmark/calls/{callId}/comparison:
    get:
      operationId: getCallComparison
      tags: [benchmark]
      summary: T-72 (E.4) -- one call, reference transcript on top, every provider's output under it as a word-diff row with its cell metrics and the judge's pick marked
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallComparison"
        "404":
          description: Call (or bulk) not found
  /benchmark/bulks/{bulkId}/calls/{callId}/comparison:
    get:
      operationId: getBulkCallComparison
      tags: [benchmark]
      summary: T-72 (E.4) -- the same comparison scoped to one bulk's runs, providers ordered by the bulk's verdict rate. (A separate operation rather than ?bulkId= because orval names a query-param type and a path-param zod schema identically and they collide.)
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallComparison"
        "404":
          description: Call or bulk not found
  /benchmark/disagreement-spans:
    get:
      operationId: listDisagreementSpans
      tags: [benchmark]
      summary: T-08 -- the stretches of one call where providers heard different words, each with a start/end in the audio, every provider's reading, and any human verdict already recorded
      parameters:
        - name: callId
          in: query
          required: true
          schema:
            type: string
        - name: runId
          in: query
          required: false
          description: Which run's results to build spans from. Defaults to the most recent run that has a successful cell for this call.
          schema:
            type: string
      responses:
        "200":
          description: Disagreement spans for the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisagreementSpansResponse"
        "404":
          description: Call not found

  /benchmark/calls/{callId}/attest-deid:
    post:
      operationId: attestBenchmarkCallDeid
      tags: [benchmark]
      summary: Record a de-identification approval (two distinct approvers required, FR-C3)
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestDeidBody"
      responses:
        "200":
          description: Updated benchmark call with attestation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCall"
        "409":
          description: Same approver cannot provide both attestations
  /benchmark/vapi/accounts:
    get:
      operationId: listVapiAccounts
      tags: [benchmark]
      summary: List Vapi source accounts configured on the server. Returns labels and key fingerprints only -- never API keys.
      responses:
        "200":
          description: Configured Vapi accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VapiAccount"
  /benchmark/vapi/assistants:
    get:
      operationId: listVapiAssistants
      tags: [benchmark]
      summary: List every assistant across every configured Vapi account (2026-08-26 -- bulk selection picks real assistants directly, not by vertical). Pass accountId to narrow to one.
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Assistants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VapiAssistant"
        "400":
          description: Unknown Vapi account id
        "502":
          description: Vapi API rejected the request
  /benchmark/vapi/preview:
    post:
      operationId: previewVapiCalls
      tags: [benchmark]
      summary: Preview Vapi calls for an account and date range without importing anything (dry run, COR-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiPreviewInput"
      responses:
        "200":
          description: Candidate calls, annotated with whether each is already in the corpus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiPreviewResult"
        "400":
          description: Invalid request or unknown/unconfigured Vapi account
        "502":
          description: Vapi API rejected the request
  /benchmark/vapi/import:
    post:
      operationId: importVapiCalls
      tags: [benchmark]
      summary: Import selected Vapi calls into the corpus as needs_review (no de-id, no gold transcript, COR-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiImportInput"
      responses:
        "201":
          description: Import outcome per requested call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiImportResult"
        "400":
          description: Invalid request or unknown/unconfigured Vapi account
        "502":
          description: Vapi API rejected the request
  /benchmark/providers:
    get:
      operationId: listBenchmarkProviders
      tags: [benchmark]
      summary: List transcription provider configurations
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createBenchmarkProvider
      tags: [benchmark]
      summary: Add or configure a transcription provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Created provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
  /benchmark/providers/{providerId}:
    patch:
      operationId: updateBenchmarkProvider
      tags: [benchmark]
      summary: Manually disable/re-enable a provider or edit its cost/notes (FR-P3). Readiness itself is derived from whether its API key env var is set, not set here.
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Provider not found
  /benchmark/settings:
    get:
      operationId: getAppSettings
      tags: [benchmark]
      summary: System-wide, changeable settings -- which provider real production calls actually use (separate from picking providers to benchmark in a bulk run), and which OpenAI model powers the transcript-quality agent's judge pass (2026-08-26)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateAppSettings
      tags: [benchmark]
      summary: Update the active production provider and/or the agent's judge model. Either field may be omitted (left unchanged) or set to null (cleared, falls back to the hardcoded default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "400":
          description: Unknown provider id
  /benchmark/runs:
    get:
      operationId: listBenchmarkRuns
      tags: [benchmark]
      summary: List benchmark executions
      responses:
        "200":
          description: Benchmark runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkRun"
    post:
      operationId: createBenchmarkRun
      tags: [benchmark]
      summary: Queue a comparable run across selected providers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkRunInput"
      responses:
        "201":
          description: Queued benchmark run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"
  /benchmark/runs/{runId}/execute:
    post:
      operationId: executeBenchmarkRun
      tags: [benchmark]
      summary: (Re)execute a queued or failed run against configured providers (FR-E4 resumable)
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Execution started (async; poll GET /benchmark/runs or /results)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"
        "404":
          description: Run not found
  /benchmark/runs/{runId}/results:
    get:
      operationId: listBenchmarkRunResults
      tags: [benchmark]
      summary: Per-cell (provider x call) raw results and scores for a run (FR-E3, drill-down)
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider call results with attached scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderCallResult"
  /benchmark/results/{resultId}/analyze-failure:
    post:
      operationId: analyzeResultFailure
      tags: [benchmark]
      summary: 2026-08-26 -- AI diagnosis + suggested fix for one failed cell's raw error message. On-demand only (real OpenAI cost per click); persisted on the result row so it survives a refresh and is never recomputed for free.
      parameters:
        - name: resultId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Diagnosis and suggested fix, now persisted on this result row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultFailureAnalysis"
        "400":
          description: OpenAI is not configured
        "404":
          description: Result not found
        "409":
          description: This cell is not failed, or has no error message to analyze
        "502":
          description: OpenAI rejected the request
  /benchmark/audit-log:
    get:
      operationId: listAuditLog
      tags: [benchmark]
      summary: Append-only audit trail of state transitions (NFR-5, compliance review)
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
  /benchmark/rankings:
    get:
      operationId: listBenchmarkRankings
      tags: [benchmark]
      summary: Get provider scores and recommendations by vertical
      description: >-
        2026-08-27, per Abhishek ("for each run then it should show the
        ranking for each, and for bulk overall ranking for all the calls"):
        without bulkId, returns the all-time view (every bulk/run ever,
        unchanged from before). With bulkId, scopes strictly to that one
        bulk's own ranking rows (benchmark_rankings.bulk_id) -- the two are
        never silently mixed.
      parameters:
        - name: bulkId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Ranked provider results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerticalRanking"
  /benchmark/trend:
    get:
      operationId: getBenchmarkTrend
      tags: [benchmark]
      summary: T-23 -- raw material for the trend strip. One summed cell per (finished bulk, client account, assistant, provider) on the T-19 basis (peer flags, normalized words, scored calls, clean calls). Totals, never rates, so any pooling downstream is exact. Free; arithmetic over stored scores.
      responses:
        "200":
          description: Finished bulks plus their summed cells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkTrend"
  /benchmark/volume:
    get:
      operationId: getClientVolume
      tags: [benchmark]
      summary: T-24 -- a client's real call volume over the trailing 14 days (Vapi's retention window, verified live), read from Vapi for the account with this label (every assistant, every call), so a $/min price can be stated as $/month. Cached 15 minutes server-side.
      parameters:
        - name: accountLabel
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Calls and minutes in the window, total and per assistant. windowDays is the basis -- a month is a projection from it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVolume"
        "404":
          description: No configured Vapi account has this label
        "502":
          description: Vapi did not answer
  /benchmark/plan:
    get:
      operationId: getBenchmarkPlan
      tags: [benchmark]
      summary: Get PRD implementation plan and task dependencies
      responses:
        "200":
          description: Implementation plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanTask"
  /benchmark/bulks:
    get:
      operationId: listBulks
      tags: [benchmark]
      summary: List evaluation bulks (FR-BLK-1), newest first
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BulkStatus"
      responses:
        "200":
          description: Bulks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bulk"
    post:
      operationId: createBulk
      tags: [benchmark]
      summary: Create a bulk from selection criteria. Resolves and FREEZES the call set, estimates cost, and either launches immediately (status running) or parks at awaiting_confirmation when the estimate exceeds the server cost threshold (FR-BLK-5) -- re-POST with confirm:true or call /launch to proceed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInput"
      responses:
        "201":
          description: Created bulk (running, or awaiting_confirmation when over the cost threshold)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulk"
        "400":
          description: Invalid criteria or nothing matched
        "409":
          description: Bulk name already in use (names are unique, FR-BLK-2)
  /benchmark/bulks/preview:
    post:
      operationId: previewBulkSelection
      tags: [benchmark]
      summary: T-14 dry-run of bulk creation. Runs the SAME matcher createBulk freezes with, and reports how many calls would run, every excluded bucket by name with its count, and (only when providerIds are given) the cost estimate the cost gate would judge. Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPreviewInput"
      responses:
        "200":
          description: Match count, named exclusions, cost estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPreview"
        "400":
          description: Invalid criteria (e.g. max duration below min)
  /benchmark/bulks/{bulkId}:
    get:
      operationId: getBulk
      tags: [benchmark]
      summary: Bulk detail with live progress aggregates (FR-EXC-4, FR-BLK-13)
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bulk with progress counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDetail"
        "404":
          description: Bulk not found
  /benchmark/bulks/{bulkId}/launch:
    post:
      operationId: launchBulk
      tags: [benchmark]
      summary: Launch a draft/awaiting_confirmation bulk -- fans the frozen call set into shard runs (FR-BLK-3). Async; poll GET /benchmark/bulks/{bulkId}.
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Launch started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulk"
        "404":
          description: Bulk not found
        "409":
          description: Bulk is not in a launchable state
  /benchmark/bulks/{bulkId}/retry-failed:
    post:
      operationId: retryBulkFailed
      tags: [benchmark]
      summary: Re-enqueue only failed/pending cells of this bulk's shard runs (FR-BLK-6; already-succeeded cells are never re-billed)
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulk"
        "404":
          description: Bulk not found
        "409":
          description: Bulk is cancelled or still launching
  /benchmark/bulks/{bulkId}/cancel:
    post:
      operationId: cancelBulk
      tags: [benchmark]
      summary: Cancel a running bulk -- un-started cells are marked cancelled; in-flight provider requests complete and are recorded (FR-BLK-7)
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulk"
        "404":
          description: Bulk not found
        "409":
          description: Bulk is already in a terminal state
  /benchmark/bulks/{bulkId}/provider-correlation:
    get:
      operationId: getBulkProviderCorrelation
      tags: [benchmark]
      summary: T-18 -- how often each pair of providers transcribed this bulk's calls the same way. Two providers that agree almost always are one witness, not two, when reading consensus. Free; text arithmetic over stored transcripts.
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pairwise agreement over the bulk's ok cells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkProviderCorrelation"
        "404":
          description: Bulk not found
  /benchmark/bulks/{bulkId}/verdicts:
    get:
      operationId: getBulkVerdicts
      tags: [benchmark]
      summary: T-20 -- the headline verdict per ranking group (winner, runner-up, margin, vs production, evidence count, comparability note) with the noise floor drawn. Refuses to name a winner when the top two are inside it. Free; arithmetic over stored scores.
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One verdict per assistant group in the bulk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkVerdicts"
        "404":
          description: Bulk not found
  /benchmark/bulks/{bulkId}/verdict.html:
    get:
      operationId: getBulkVerdictArtefact
      tags: [benchmark]
      summary: T-32 -- the shareable dated verdict artefact. One self-contained HTML page (no scripts, no external assets, print-clean) rendered from the same numbers as getBulkVerdicts, stamped with the produced-at time, build SHA and scoring version. Open in a browser or save/attach; not part of the generated JSON client.
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Self-contained HTML document
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Bulk not found
  /benchmark/bulks/{bulkId}/manifest:
    get:
      operationId: getBulkManifest
      tags: [benchmark]
      summary: Immutable bulk manifest -- the composition of every shard run's frozen manifest (FR-BLK-8, FR-REP1 replay evidence)
      parameters:
        - name: bulkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bulk manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkManifest"
        "404":
          description: Bulk not found
  /benchmark/bulk-templates:
    get:
      operationId: listBulkTemplates
      tags: [benchmark]
      summary: List saved reusable bulk templates (FR-BLK-9)
      responses:
        "200":
          description: Bulk templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkTemplate"
    post:
      operationId: createBulkTemplate
      tags: [benchmark]
      summary: Save selection criteria as a named template. Criteria stay UNFROZEN -- a relative window like lastNDays is re-resolved at every launch (FR-BLK-9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTemplate"
        "409":
          description: Template name already in use
  /benchmark/bulk-templates/{templateId}:
    delete:
      operationId: deleteBulkTemplate
      tags: [benchmark]
      summary: Delete a saved template (T-50). Bulks already launched from it are untouched -- they froze their own call set and provider list at creation.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Template not found
  /benchmark/bulk-templates/{templateId}/launch:
    post:
      operationId: launchBulkTemplate
      tags: [benchmark]
      summary: Launch a template -- re-resolves its relative date window against right now, then creates (and cost-gates) a fresh bulk (FR-BLK-9, AC-2.7)
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTemplateLaunchInput"
      responses:
        "201":
          description: Bulk created from the template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulk"
        "400":
          description: Nothing matched the resolved criteria
        "404":
          description: Template not found
  /benchmark/runs/{runId}/manifest:
    get:
      operationId: getBenchmarkRunManifest
      tags: [benchmark]
      summary: Immutable run manifest -- frozen corpus + provider config + scoring version snapshot (RUN-01, P2-T1)
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunManifest"
        "404":
          description: Run not found or predates manifests
  /benchmark/agent/scans:
    get:
      operationId: listAgentScans
      tags: [benchmark]
      summary: List transcript-quality-agent scans, optionally filtered to one call
      parameters:
        - name: callId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Agent scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentScan"
    post:
      operationId: createAgentScan
      tags: [benchmark]
      summary: Scan one call's current best transcript for likely mis-transcriptions, and (if any are found) re-transcribe it across the other configured providers for the agent to compare -- on-demand, one call at a time (not automatic on import)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentScanInput"
      responses:
        "201":
          description: Completed scan (clean, or flagged with an agent pick to review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentScan"
        "404":
          description: Call not found
        "409":
          description: Call has no transcript to scan yet
  /benchmark/agent/scans/{scanId}/approve:
    post:
      operationId: approveAgentScan
      tags: [benchmark]
      summary: A human accepts the agent's picked transcript as gold -- drives the same PATCH /benchmark/calls logic and de-id gate as manual review (draft != gold rule; the agent's pick is never written on its own)
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentScanDecision"
      responses:
        "200":
          description: Updated scan and call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentScan"
        "404":
          description: Scan not found
        "409":
          description: Scan has no pick to approve, or is not awaiting a decision
  /benchmark/agent/scans/{scanId}/reject:
    post:
      operationId: rejectAgentScan
      tags: [benchmark]
      summary: A human rejects the agent's pick -- no data changes, call keeps its current gold transcript
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentScanDecision"
      responses:
        "200":
          description: Updated scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentScan"
        "404":
          description: Scan not found
        "409":
          description: Scan was already decided (approved or rejected)
components:
  schemas:
    SpanReading:
      type: object
      required: [providerId, text, agreesWithReference, agreesWithMajority]
      properties:
        providerId: { type: string }
        text: { type: string }
        agreesWithReference: { type: boolean }
        # T-47: true when this text is the span's plurality; false for all when tied.
        agreesWithMajority: { type: boolean }
    WordsToWatch:
      type: object
      required: [bulkId, bulksCovered, assistantId, callsScanned, callsWithSpans, words]
      properties:
        # Null = all-time (T-92).
        bulkId: { type: ["string", "null"] }
        bulksCovered: { type: number }
        assistantId: { type: ["string", "null"] }
        callsScanned: { type: number }
        callsWithSpans: { type: number }
        words:
          type: array
          items:
            type: object
            required: [heardAs, kind, noMajority, calls, spans, alternatives, exampleCallIds]
            properties:
              heardAs: { type: string }
              # number = a digit on any side (meaning at stake); filler = every reading is empty or a filler word; word = the rest.
              kind: { type: string, enum: [number, word, filler] }
              noMajority: { type: boolean }
              calls: { type: number }
              spans: { type: number }
              alternatives:
                type: array
                items:
                  type: object
                  required: [text, count, providerIds]
                  properties:
                    text: { type: string }
                    count: { type: number }
                    providerIds:
                      type: array
                      items: { type: string }
              exampleCallIds:
                type: array
                items: { type: string }
    DisagreementSpan:
      type: object
      required: [startMs, endMs, contextBefore, contextAfter, referencePositions, readings, majorityText]
      properties:
        startMs: { type: number }
        endMs: { type: number }
        # T-47: plurality reading across providers (reference counts as one vote); null on a tie.
        majorityText: { type: ["string", "null"] }
        contextBefore: { type: string }
        contextAfter: { type: string }
        # T-22: inclusive [first, last] index into DisagreementSpansResponse.referenceWords.
        referencePositions:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
        readings:
          type: array
          items: { $ref: "#/components/schemas/SpanReading" }
    DisagreementSpansResponse:
      type: object
      required: [callId, runId, referenceProviderId, referenceWords, unavailableReason, spans]
      properties:
        callId: { type: string }
        # null when no run has a successful cell for this call yet.
        runId: { type: ["string", "null"] }
        referenceProviderId: { type: ["string", "null"] }
        # T-22: the reference provider's normalized words in order, so the UI can
        # render one flowing reading with disputed spans inline. Empty when no reference.
        referenceWords:
          type: array
          items: { type: string }
        unavailableReason:
          oneOf:
            - type: string
              enum: [no_run, no_word_timings, fewer_than_two_candidates]
            - type: "null"
        spans:
          type: array
          items: { $ref: "#/components/schemas/DisagreementSpan" }
    HealthStatus:
      type: object
      required: [status, commitSha, builtAt, startedAt, providersConfigured]
      properties:
        status:
          type: string
        # T-04 (2026-08-28): build identity, so the running process can say
        # which code it is actually running. There is no watch mode on this
        # server -- a source change needs a rebuild AND a restart, and
        # without these fields nothing on screen distinguished "rebuilt but
        # not restarted" from "running the new code".
        #
        # commitSha is frozen into the bundle at BUILD time (esbuild
        # define), so it describes the bundle, not the working tree at
        # start. "dev" means running from source (tsx); a "-dirty" suffix
        # means the tree had uncommitted changes when it was built, so the
        # bundle does not correspond to that commit.
        commitSha:
          type: string
        # Null when running from source rather than a built bundle.
        builtAt:
          type: string
          nullable: true
        # When this process started. builtAt newer than startedAt means a
        # rebuild has happened that this process is not running.
        startedAt:
          type: string
        # NAMES ONLY -- provider ids whose API key env var is non-empty.
        # Never a key, never a prefix, never a length. This endpoint is
        # unauthenticated, so everything here is public by definition.
        providersConfigured:
          type: array
          items: { type: string }
    Vertical:
      type: string
      enum: [rush, property_management, trucking]
    CallStatus:
      type: string
      enum: [needs_review, ready_for_gold, gold_in_review, ready_to_run, archived]
    ProviderStatus:
      type: string
      enum: [not_configured, ready, disabled]
    RunStatus:
      type: string
      enum: [queued, running, complete, blocked, failed, cancelled]
    EntityType:
      type: string
      enum: [ro_number, unit_number, vin, phone_number, name, address, load_number, city]
    EntityReference:
      type: object
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/EntityType" }
        value: { type: string }
    BenchmarkCall:
      type: object
      required: [id, label, vertical, durationSeconds, status, hardCases, entityReferences, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        vertical: { $ref: "#/components/schemas/Vertical" }
        durationSeconds: { type: number }
        status: { $ref: "#/components/schemas/CallStatus" }
        hardCases:
          type: array
          items: { type: string }
        goldTranscript: { type: ["string", "null"] }
        # The source provider's verbatim transcript. Reference material for
        # the reviewer and the left side of the review diff -- never scored.
        draftTranscript: { type: ["string", "null"] }
        entityNotes: { type: ["string", "null"] }
        entityReferences:
          type: array
          items: { $ref: "#/components/schemas/EntityReference" }
        audioObjectPath: { type: ["string", "null"] }
        deIdAttestedByLabel: { type: ["string", "null"] }
        deIdAttestedAt: { type: ["string", "null"], format: date-time }
        deIdSecondApproverLabel: { type: ["string", "null"] }
        deIdSecondApprovedAt: { type: ["string", "null"], format: date-time }
        # Provenance: where this recording came from. "manual" for calls
        # registered by hand, "vapi" for imported ones.
        sourceProvider: { type: string }
        sourceCallId: { type: ["string", "null"] }
        sourceAccountLabel: { type: ["string", "null"] }
        sourceAssistantId: { type: ["string", "null"] }
        sourceStartedAt: { type: ["string", "null"], format: date-time }
        # Best-effort: which STT model produced draftTranscript, per Vapi's
        # own assistant config at import time. Null when Vapi didn't echo it
        # back. Surfaced so a reviewer can see if the draft came from a
        # provider also being benchmarked (anchoring risk) -- see
        # docs/backlog/good-to-have.md.
        sourceTranscriberProvider: { type: ["string", "null"] }
        sourceTranscriberModel: { type: ["string", "null"] }
        # T-11: Vapi's endedReason / analysis.successEvaluation, verbatim.
        # Null = not captured; never "normal call".
        sourceEndedReason: { type: ["string", "null"] }
        sourceSuccessEvaluation: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BenchmarkCallInput:
      type: object
      required: [label, vertical, durationSeconds]
      properties:
        label: { type: string, minLength: 2 }
        vertical: { $ref: "#/components/schemas/Vertical" }
        durationSeconds: { type: number, minimum: 1 }
        hardCases:
          type: array
          items: { type: string }
        entityNotes: { type: string }
        entityReferences:
          type: array
          items: { $ref: "#/components/schemas/EntityReference" }
        audioObjectPath: { type: string }
    BenchmarkCallUpdate:
      type: object
      properties:
        label: { type: string, minLength: 2 }
        status: { $ref: "#/components/schemas/CallStatus" }
        goldTranscript: { type: string }
        entityNotes: { type: string }
        entityReferences:
          type: array
          items: { $ref: "#/components/schemas/EntityReference" }
        hardCases:
          type: array
          items: { type: string }
    VapiAccount:
      type: object
      required: [id, label, envVar, keyFingerprint]
      properties:
        id: { type: string }
        label: { type: string }
        # Which env var supplied the key, so an operator can tell where to
        # rotate it. The key value itself is never serialized.
        envVar: { type: string }
        keyFingerprint: { type: string }
    VapiAssistant:
      type: object
      required: [id, name, accountId, accountLabel]
      properties:
        id: { type: string }
        name: { type: string }
        accountId: { type: string }
        accountLabel: { type: string }
    VapiPreviewInput:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, minLength: 1 }
        limit: { type: number, minimum: 1, maximum: 500 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        assistantId: { type: string }
    VapiPreviewCall:
      type: object
      required: [vapiCallId, durationSeconds, hasRecording, alreadyImported, draftTranscriptChars]
      properties:
        vapiCallId: { type: string }
        assistantId: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        durationSeconds: { type: number }
        hasRecording: { type: boolean }
        recordingUrl: { type: ["string", "null"] }
        draftTranscriptChars: { type: number }
        draftTranscriptPreview: { type: ["string", "null"] }
        alreadyImported: { type: boolean }
        existingCallId: { type: ["string", "null"] }
    VapiPreviewResult:
      type: object
      required: [accountId, accountLabel, fetchedCount, importableCount, calls]
      properties:
        accountId: { type: string }
        accountLabel: { type: string }
        fetchedCount: { type: number }
        importableCount: { type: number }
        calls:
          type: array
          items: { $ref: "#/components/schemas/VapiPreviewCall" }
    VapiImportInput:
      type: object
      required: [accountId, vertical, vapiCallIds]
      properties:
        accountId: { type: string, minLength: 1 }
        vertical: { $ref: "#/components/schemas/Vertical" }
        vapiCallIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
    VapiImportOutcome:
      type: object
      required: [vapiCallId, outcome]
      properties:
        vapiCallId: { type: string }
        outcome: { type: string, enum: [imported, skipped_duplicate, skipped_no_recording, failed] }
        callId: { type: ["string", "null"] }
        label: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
    VapiImportResult:
      type: object
      required: [importedCount, skippedCount, failedCount, results]
      properties:
        importedCount: { type: number }
        skippedCount: { type: number }
        failedCount: { type: number }
        results:
          type: array
          items: { $ref: "#/components/schemas/VapiImportOutcome" }
    AttestDeidBody:
      type: object
      required: [approverLabel]
      properties:
        approverLabel: { type: string, minLength: 2 }
    Provider:
      type: object
      required: [id, name, model, status, supportsStreaming, supportsDiarization, costPerMinute, keywordBoosting, hasAdapter, apiKeyConfigured]
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        status: { $ref: "#/components/schemas/ProviderStatus" }
        supportsStreaming: { type: boolean }
        supportsDiarization: { type: boolean }
        costPerMinute: { type: number }
        keywordBoosting: { type: boolean }
        configNote: { type: ["string", "null"] }
        # Derived, read-only signals (not stored input): whether a PRO-03
        # adapter exists for this provider id, and whether its API key env
        # var is currently set. `status` is computed from these.
        hasAdapter: { type: boolean }
        apiKeyConfigured: { type: boolean }
    ProviderUpdate:
      type: object
      properties:
        disabled: { type: boolean }
        costPerMinute: { type: number, minimum: 0 }
        configNote: { type: string }
    ProviderInput:
      type: object
      required: [name, model, costPerMinute]
      properties:
        name: { type: string, minLength: 2 }
        model: { type: string, minLength: 2 }
        costPerMinute: { type: number, minimum: 0 }
        supportsStreaming: { type: boolean }
        supportsDiarization: { type: boolean }
        keywordBoosting: { type: boolean }
        configNote: { type: string }
    AppSettings:
      type: object
      required: [activeProviderId, agentModel]
      description: 2026-08-26. Null on either field means "no override -- fall back to the hardcoded default" (no active provider designated; lib/agent.ts's own JUDGE_MODEL constant).
      properties:
        activeProviderId: { type: ["string", "null"], description: "Which provider real production calls actually use. Independent of which providers a bulk run benchmarks." }
        agentModel: { type: ["string", "null"], description: "OpenAI model for the transcript-quality agent's judge pass (lib/agent.ts). The cheap flag-pass model is not user-configurable." }
    AppSettingsUpdate:
      type: object
      properties:
        activeProviderId: { type: ["string", "null"] }
        agentModel: { type: ["string", "null"] }
    BenchmarkRun:
      type: object
      required: [id, status, providerIds, callCount, createdAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        providerIds:
          type: array
          items: { type: string }
        callCount: { type: number }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        # Bulk lineage (FR-BLK-13): null for ad-hoc Runs-page runs; set for
        # shard runs fanned out from a bulk, with the bulk's display name.
        bulkId: { type: ["string", "null"] }
        bulkName: { type: ["string", "null"] }
        shardIndex: { type: ["number", "null"] }
    BenchmarkRunInput:
      type: object
      required: [providerIds, callIds]
      properties:
        providerIds:
          type: array
          minItems: 1
          items: { type: string }
        callIds:
          type: array
          minItems: 1
          items: { type: string }
        notes: { type: string }
    Score:
      type: object
      # null means "no scored cells had this metric" -- not "scored zero".
      # Was previously non-nullable with a 0 fallback at write time, which
      # made "we never measured this" indistinguishable from "measured and
      # it was zero" (found 2026-08-24: alphanumericAccuracy showing 0 on
      # every ranking row because no entity in the corpus is both letters
      # and digits after normalization, so it was never actually scored).
      required: [wer, entityAccuracy, alphanumericAccuracy, latencyFirstPartialMs, latencyFinalMs, costPerMinute, diarizationScore, avgFlagCount, avgFlagSeverityScore, avgPeerFlagCount, avgPeerFlagSeverityScore, peerFlagsPer100Words, cleanCallRate]
      properties:
        wer: { type: ["number", "null"], description: "2026-08-27 -- permanently null going forward (no gold transcript to diff against). Kept for historical runs scored before this change." }
        entityAccuracy: { type: ["number", "null"], description: "Same as wer -- permanently null going forward, kept for historical runs." }
        alphanumericAccuracy: { type: ["number", "null"] }
        latencyFirstPartialMs: { type: ["number", "null"] }
        latencyFinalMs: { type: ["number", "null"] }
        costPerMinute: { type: ["number", "null"] }
        diarizationScore: { type: ["number", "null"] }
        # 2026-08-27, found live (Abhishek: "for this call why its different
        # then?" on a case where Rank contradicted this column): this is the
        # FULL flag picture, including a provider's own self-reported low-
        # confidence spans -- only fair to compare among the 3 of 7
        # providers that report confidence at all (AssemblyAI/Deepgram/
        # Gladia). This is NOT what Rank sorts by (avgPeerFlagCount is) --
        # kept here for display/context, the stale claim that it drives
        # sorting is corrected below.
        avgFlagCount: { type: ["number", "null"], description: "Gold-free hybrid flag count (disagreement + confidence + entity), averaged across this provider's cells. Includes self-reported low-confidence spans, so only directly comparable among the providers that report confidence at all -- NOT what Rank is computed from (see avgPeerFlagCount)." }
        avgFlagSeverityScore: { type: ["number", "null"], description: "severityRank() averaged across cells: 0=none .. 3=high. Same confidence-inclusive caveat as avgFlagCount." }
        avgPeerFlagCount: { type: ["number", "null"], description: "Confidence-EXCLUDED flag count (cross-provider disagreement + entity mismatches only) -- comparable fairly across every provider regardless of whether it reports confidence. This, not avgFlagCount, is what the composite Rank actually sorts by." }
        avgPeerFlagSeverityScore: { type: ["number", "null"], description: "severityRank() of avgPeerFlagCount's flags, averaged: 0=none .. 3=high." }
        # T-19: rates, computed in the API when the ranking snapshot is
        # written (never by the component). Null = nothing scored, not 0.
        peerFlagsPer100Words: { type: ["number", "null"], description: "Peer-only flags per 100 words this provider transcribed in the group. Same basis as the composite; comparable across call lengths." }
        cleanCallRate: { type: ["number", "null"], description: "Share (0..1) of this provider's scored calls in the group that carried zero peer flags." }
    ProviderCallResult:
      type: object
      required: [id, runId, providerId, callId, status, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        providerId: { type: string }
        callId: { type: string }
        status: { type: string, enum: [pending, ok, failed, skipped_pending_review, cancelled] }
        submittedAt: { type: ["string", "null"], format: date-time }
        finalAt: { type: ["string", "null"], format: date-time }
        httpStatus: { type: ["number", "null"] }
        hypothesisTranscript: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        # T-06 (2026-08-28). Set at the throw site by the code that saw the
        # failure -- never inferred from errorMessage. Null when the cell
        # did not fail, and also null on rows written before this existed
        # (those predate classification and are not back-guessed).
        # "unknown" is a real, expected value: a failure nobody has
        # classified yet stays visible as unclassified rather than being
        # filed under the nearest-looking bucket.
        failureClass:
          oneOf:
            - type: string
              enum: [retention_expired, audio_url_forbidden, provider_timeout, provider_5xx, rate_limited, audio_decode, provider_auth, unknown]
            - type: "null"
        failureDiagnosis: { type: ["string", "null"], description: "2026-08-26 -- set by POST .../analyze-failure; null until analyzed (or if this cell never failed)." }
        failureSuggestedFix: { type: ["string", "null"] }
        # T-73 (E.5). Decided server-side by isRetryableFailureClass() -- the
        # same rule the executor and the bulk failure groups use, so the UI
        # never re-derives it. true/false only for failed cells with a class
        # (and true for skipped_pending_review, which a re-run picks up once
        # the call clears review); null = not a failure, or a failure that
        # predates classification (never defaulted to either).
        retryable: { type: ["boolean", "null"] }
        rawOutputHash: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        score:
          oneOf:
            - $ref: "#/components/schemas/ScoreDetail"
            - type: "null"
    ScoreDetail:
      type: object
      required: [scoringVersion]
      properties:
        scoringVersion: { type: string }
        wer: { type: ["number", "null"] }
        entityAccuracy: { type: ["number", "null"] }
        alphanumericAccuracy: { type: ["number", "null"] }
        latencyFinalMs: { type: ["number", "null"] }
        costPerMinute: { type: ["number", "null"] }
        diarizationScore: { type: ["number", "null"] }
        wordDiff:
          type: array
          items: { $ref: "#/components/schemas/WordDiffOp" }
        flagCount: { type: ["number", "null"], description: "2026-08-27: gold-free hybrid flag count for this cell (cross-provider disagreement + confidence + entity mismatches)." }
        flagSeverity: { type: ["string", "null"], enum: [none, low, medium, high, null] }
        hybridFlags: { $ref: "#/components/schemas/HybridFlagDetail" }
    ComparisonDiff:
      type: object
      description: Word alignment of one transcript against THIS section's reference (gold when the call has one, else the Vapi draft). Not the retired gold WER column -- computed fresh on read.
      required: [wordDiff, referenceWords, wordsDiffer, werVsReference]
      properties:
        wordDiff:
          type: array
          items: { $ref: "#/components/schemas/WordDiffOp" }
        referenceWords: { type: number }
        wordsDiffer: { type: number }
        werVsReference: { type: ["number", "null"], description: "wordsDiffer / referenceWords; null when the reference is empty." }
    ComparisonRow:
      type: object
      required: [providerId, providerName, status, resultId, runId, attemptedAt, hypothesisTranscript, diff, peerFlagCount, peerFlagSeverity, flagCount, flagSeverity, hybridFlags, latencyFinalMs, costMicrocents, failureClass, retryable, errorMessage, failureDiagnosis, failureSuggestedFix, isJudgePick]
      properties:
        providerId: { type: string }
        providerName: { type: string }
        # "missing": the provider was in the run's provider list but no result
        # row exists for this call -- still a row (E.5), never dropped.
        status: { type: string, enum: [ok, failed, skipped_pending_review, pending, cancelled, missing] }
        resultId: { type: ["string", "null"] }
        runId: { type: ["string", "null"] }
        attemptedAt: { type: ["string", "null"], format: date-time }
        hypothesisTranscript: { type: ["string", "null"] }
        diff:
          oneOf:
            - $ref: "#/components/schemas/ComparisonDiff"
            - type: "null"
        peerFlagCount: { type: ["number", "null"] }
        peerFlagSeverity: { type: ["string", "null"] }
        flagCount: { type: ["number", "null"] }
        flagSeverity: { type: ["string", "null"] }
        hybridFlags:
          type: ["object", "null"]
          required: [disagreementRate, lowConfidenceSpans, confidenceAvailable, entityMismatches]
          properties:
            disagreementRate: { type: ["number", "null"] }
            lowConfidenceSpans: { type: number }
            confidenceAvailable: { type: boolean }
            entityMismatches: { type: number }
        latencyFinalMs: { type: ["number", "null"] }
        costMicrocents: { type: ["number", "null"], description: "Micro-cents (1 cent = 10,000). null = not recorded, never zero." }
        failureClass:
          oneOf:
            - type: string
              enum: [retention_expired, audio_url_forbidden, provider_timeout, provider_5xx, rate_limited, audio_decode, provider_auth, unknown]
            - type: "null"
        # null = retryability unknown (no class on file); never defaulted.
        retryable: { type: ["boolean", "null"] }
        errorMessage: { type: ["string", "null"] }
        failureDiagnosis: { type: ["string", "null"] }
        failureSuggestedFix: { type: ["string", "null"] }
        isJudgePick: { type: boolean }
    CallComparison:
      type: object
      description: T-72 (E.4). The reference is gold only when the call has a gold transcript; otherwise it is the Vapi draft, labelled draft -- the draft is Vapi's own live provider output and is never presented as a standard. When the reference is gold, the draft is still shown as productionRow.
      required: [callId, label, callStatus, durationSeconds, reference, audioAvailable, production, productionRow, context, ordering, judge, rows]
      properties:
        callId: { type: string }
        label: { type: string }
        callStatus: { type: string }
        durationSeconds: { type: number }
        reference:
          type: ["object", "null"]
          required: [kind, text]
          properties:
            kind: { type: string, enum: [gold, draft] }
            text: { type: string }
        audioAvailable: { type: boolean }
        production:
          type: ["object", "null"]
          required: [vendor, model]
          properties:
            vendor: { type: string }
            model: { type: ["string", "null"] }
        productionRow:
          type: ["object", "null"]
          required: [text, diff]
          properties:
            text: { type: string }
            diff:
              oneOf:
                - $ref: "#/components/schemas/ComparisonDiff"
                - type: "null"
        context:
          type: ["object", "null"]
          required: [bulkId, bulkName]
          properties:
            bulkId: { type: string }
            bulkName: { type: string }
        ordering: { type: string, enum: [verdict_rate, alphabetical] }
        judge:
          type: ["object", "null"]
          required: [scanId, status, pickProviderId, reasoning, createdAt]
          properties:
            scanId: { type: string }
            status: { type: string }
            pickProviderId: { type: ["string", "null"] }
            reasoning: { type: ["string", "null"] }
            createdAt: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ComparisonRow" }
    HybridFlagDetail:
      type: object
      description: The structured breakdown behind flagCount/flagSeverity -- what a reviewer actually sees when they expand a flagged cell.
      properties:
        crossProviderDisagreement:
          type: ["object", "null"]
          properties:
            disagreementRate: { type: number }
            mismatchWords: { type: number }
            comparedWords: { type: number }
        lowConfidenceSpans:
          type: array
          items:
            type: object
            properties:
              words: { type: array, items: { type: string } }
              avgConfidence: { type: number }
              severity: { type: string, enum: [none, low, medium, high] }
        entityMismatches:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              valuesByProvider: { type: object, additionalProperties: { type: array, items: { type: string } } }
    WordDiffOp:
      type: object
      required: [op, ref, hyp]
      properties:
        op: { type: string, enum: [ok, sub, del, ins] }
        ref: { type: ["string", "null"] }
        hyp: { type: ["string", "null"] }
    AgentFlag:
      type: object
      required: [text, reason]
      properties:
        text: { type: string }
        reason: { type: string }
    AgentScanCandidate:
      type: object
      required: [providerId, providerName, status, transcript]
      properties:
        providerId: { type: string }
        providerName: { type: string }
        status: { type: string, enum: [pending, ok, failed] }
        transcript: { type: ["string", "null"] }
    ResultFailureAnalysis:
      type: object
      required: [resultId, diagnosis, suggestedFix]
      properties:
        resultId: { type: string }
        diagnosis: { type: string }
        suggestedFix: { type: string }
    AgentScan:
      type: object
      description: 2026-08-27 -- gold-free. No longer requires (or produces) a gold transcript; the hybrid pass compares candidates to each other. sourceLabel/sourceTranscript are best-effort context (Vapi's own draft), not an analysis input anymore.
      required: [id, callId, sourceLabel, sourceTranscript, status, flags, candidates, requestedByLabel, createdAt]
      properties:
        id: { type: string }
        callId: { type: string }
        sourceLabel: { type: ["string", "null"], enum: [draft, gold, null], description: "\"gold\" only appears on scans created before 2026-08-27 (gold transcripts retired) -- new scans only ever produce \"draft\" or null." }
        sourceTranscript: { type: ["string", "null"], description: "Vapi's own draft transcript at scan time, for context only -- null if the call has no draft on file." }
        # scanning: transient, never actually observed by a client (the scan
        # route awaits the whole flow before responding -- see routes/agent.ts
        # for why that's a deliberate v1 choice, not fire-and-forget).
        status: { type: string, enum: [scanning, clean, flagged, error, approved, rejected] }
        flags:
          type: array
          items: { $ref: "#/components/schemas/AgentFlag" }
        hybridFlags:
          oneOf:
            - $ref: "#/components/schemas/HybridFlagSummary"
            - type: "null"
        runId: { type: ["string", "null"] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/AgentScanCandidate" }
        agentPickProviderId: { type: ["string", "null"] }
        agentPickReasoning: { type: ["string", "null"] }
        # T-01 (2026-08-28): these three were serialised by routes/agent.ts
        # but never declared here, so the response parse dropped them and no
        # client could ever see what a judgement cost. Micro-cents; null on
        # "clean" scans (no LLM call was made) and on models with no
        # published rate -- null means "not recorded", never zero.
        judgePromptTokens: { type: ["number", "null"] }
        judgeCompletionTokens: { type: ["number", "null"] }
        judgeCostMicrocents: { type: ["number", "null"] }
        errorMessage: { type: ["string", "null"] }
        requestedByLabel: { type: string }
        decidedByLabel: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    HybridFlagSummary:
      type: object
      required: [flagCount, flagSeverity, crossProviderDisagreements, lowConfidenceSpans, entityMismatches]
      properties:
        flagCount: { type: number }
        flagSeverity: { type: string, enum: [none, low, medium, high] }
        crossProviderDisagreements:
          type: array
          items:
            type: object
            properties:
              providerId: { type: string }
              disagreementRate: { type: number }
        lowConfidenceSpans:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                words: { type: array, items: { type: string } }
                avgConfidence: { type: number }
                severity: { type: string }
        entityMismatches:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              valuesByProvider: { type: object, additionalProperties: { type: array, items: { type: string } } }
    AgentScanInput:
      type: object
      required: [callId]
      properties:
        callId: { type: string }
    AgentScanDecision:
      type: object
      required: [approverLabel]
      properties:
        approverLabel: { type: string }
    AuditLogEntry:
      type: object
      required: [id, entityType, entityId, actorLabel, action, occurredAt]
      properties:
        id: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        actorLabel: { type: string }
        action: { type: string }
        beforeState: {}
        afterState: {}
        occurredAt: { type: string, format: date-time }
    VerticalRanking:
      type: object
      description: 2026-08-27 -- grouped by real Vapi assistant now (assistantId/assistantLabel), not vertical. `vertical` stays as a display tag per row, kept for context, not the grouping key anymore (see GET /benchmark/rankings).
      required: [runId, vertical, assistantId, assistantLabel, providerId, providerName, rank, score, recommendation]
      properties:
        runId: { type: string }
        vertical: { $ref: "#/components/schemas/Vertical" }
        assistantId: { type: ["string", "null"], description: "Null buckets into the \"Other\" group (a manually-added call with no Vapi assistant)." }
        assistantLabel: { type: string, description: "Resolved live from Vapi at read time; \"Unassigned (no assistant ID captured at import)\" when assistantId is null." }
        providerId: { type: string }
        providerName: { type: string }
        rank: { type: number }
        score: { $ref: "#/components/schemas/Score" }
        recommendation: { type: string }
    BenchmarkDashboard:
      type: object
      description: 2026-08-27 -- the pipeline dropped its gold-transcript stage (goldReadyCount removed). A call now only needs de-id sign-off to reach readyToRunCount.
      required: [corpusCount, readyToRunCount, configuredProviderCount, totalProviderCount, latestRunStatus, decisionStatus, latestFinishedBulk, runningBulk, needsHuman, thisMonth]
      properties:
        corpusCount: { type: number }
        readyToRunCount: { type: number }
        configuredProviderCount: { type: number }
        totalProviderCount: { type: number }
        latestRunStatus: { $ref: "#/components/schemas/RunStatus" }
        decisionStatus: { type: string }
        # T-71 (E.3). The four Overview blocks, computed server-side from the
        # same tables the detail pages read (lib/overview.ts). The verdict
        # itself is NOT duplicated here -- the page fetches
        # GET /benchmark/bulks/{id}/verdicts for latestFinishedBulk, the same
        # source Results uses. Null = no such bulk, never an empty object.
        latestFinishedBulk:
          type: ["object", "null"]
          required: [id, name, status, completedAt]
          properties:
            id: { type: string }
            name: { type: string }
            # complete or partial -- partial is finished-with-failures.
            status: { $ref: "#/components/schemas/BulkStatus" }
            completedAt: { type: ["string", "null"], format: date-time }
        runningBulk:
          type: ["object", "null"]
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        needsHuman:
          type: object
          required: [callsAwaitingReview, hardCaseCalls, retryableFailedCells]
          properties:
            callsAwaitingReview: { type: number }
            hardCaseCalls: { type: number }
            # Failed / skipped cells in stopped (partial, failed) bulks that
            # a retry could fix -- same rule as POST /bulks/{id}/retry-failed.
            retryableFailedCells: { type: number }
        thisMonth:
          type: object
          required: [monthStart, sttMicrocents, sttCellsPriced, sttCellsUnpriced, agentMicrocents, agentJudgementsPriced, agentJudgementsUnpriced]
          properties:
            # Calendar month start, UTC.
            monthStart: { type: string, format: date-time }
            # STT and agent (OpenAI judge) spend kept apart -- standing rule
            # 2026-08-27. Micro-cents. A sum only covers rows with a recorded
            # cost; *Unpriced counts the rows it could not include, so 0 with
            # unpriced > 0 reads "not recorded", never "free".
            sttMicrocents: { type: number }
            sttCellsPriced: { type: number }
            sttCellsUnpriced: { type: number }
            agentMicrocents: { type: number }
            agentJudgementsPriced: { type: number }
            agentJudgementsUnpriced: { type: number }
    PlanTask:
      type: object
      required: [id, phase, title, description, status, dependencies, logicNotes]
      properties:
        id: { type: string }
        phase: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        dependencies:
          type: array
          items: { type: string }
        logicNotes:
          type: array
          items: { type: string }
    BulkStatus:
      type: string
      # FR-BLK-4. partial = >=1 cell failed after retries; cancelled via
      # POST /benchmark/bulks/{id}/cancel.
      enum: [draft, estimating, awaiting_confirmation, running, complete, partial, failed, cancelled]
    BulkSelectionCriteria:
      type: object
      description: On a template this is unfrozen (lastNDays re-resolves per launch); on a bulk it is frozen at creation, with resolvedCallIds pinning the exact corpus slice (FR-BLK-1 vs FR-BLK-9).
      properties:
        vertical: { $ref: "#/components/schemas/Vertical" }
        assistantIds:
          type: array
          items: { type: string }
        accountLabel: { type: string }
        startedAtFrom: { type: string, format: date-time }
        startedAtTo: { type: string, format: date-time }
        lastNDays: { type: number, minimum: 1 }
        minDurationSeconds: { type: number, minimum: 0 }
        # T-10: null = no upper cap.
        maxDurationSeconds: { type: ["number", "null"], minimum: 0 }
        # T-13: outcome filters on Vapi's verbatim endedReason / successEvaluation.
        # A call with no captured outcome (null) never passes either list.
        includeEndedReasons:
          type: array
          items: { type: string }
        excludeEndedReasons:
          type: array
          items: { type: string }
        successEvaluation: { type: string }
        callIds:
          type: array
          items: { type: string }
        resolvedCallIds:
          type: array
          items: { type: string }
        resolvedAt: { type: ["string", "null"], format: date-time }
    Bulk:
      type: object
      required: [id, name, status, selectionCriteria, providerIds, shardSize, minDurationSeconds, maxDurationSeconds, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/BulkStatus" }
        selectionCriteria: { $ref: "#/components/schemas/BulkSelectionCriteria" }
        providerIds:
          type: array
          items: { type: string }
        shardSize: { type: number }
        minDurationSeconds: { type: number }
        maxDurationSeconds: { type: ["number", "null"] }
        estimatedCostCents: { type: ["number", "null"] }
        estimatedSttCostCents: { type: ["number", "null"] }
        estimatedAgentCostCents: { type: ["number", "null"] }
        launchedByLabel: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    BulkInput:
      type: object
      required: [criteria, providerIds]
      properties:
        # FR-BLK-2: defaults to the launch date (YYYY-MM-DD) when omitted.
        name: { type: string, minLength: 1 }
        criteria: { $ref: "#/components/schemas/BulkSelectionCriteria" }
        providerIds:
          type: array
          minItems: 1
          items: { type: string }
        shardSize: { type: number, minimum: 1, maximum: 500 }
        minDurationSeconds: { type: number, minimum: 0 }
        # T-10: omitted = default band cap (120s); explicit null = no cap.
        maxDurationSeconds: { type: ["number", "null"], minimum: 0 }
        # FR-BLK-5: required true when the estimate exceeds the server cost
        # threshold; without it the bulk parks at awaiting_confirmation.
        confirm: { type: boolean }
    BulkPreviewInput:
      type: object
      required: [criteria]
      properties:
        criteria: { $ref: "#/components/schemas/BulkSelectionCriteria" }
        # Optional here (unlike BulkInput): the count is meaningful with no
        # providers chosen yet; only the cost estimate needs them.
        providerIds:
          type: array
          items: { type: string }
        minDurationSeconds: { type: number, minimum: 0 }
        maxDurationSeconds: { type: ["number", "null"], minimum: 0 }
    BulkPreviewExclusion:
      type: object
      required: [bucket, count]
      properties:
        # Human-readable reason, e.g. "shorter than 60s", "outcome:
        # silence-timed-out", "no captured outcome".
        bucket: { type: string }
        count: { type: number }
    BulkPreview:
      type: object
      required: [inScopeCount, matchedCount, excluded, estimate, costThresholdCents, productionCoverage]
      properties:
        # T-56: one entry per production transcriber (vendor/model) among
        # the matched calls. benchmarked=false means the verdict will not be
        # able to say "vs production" for those calls -- shown as a warning
        # before the cost, never blocking.
        productionCoverage:
          type: array
          items:
            type: object
            required: [vendor, model, calls, providerId, benchmarked]
            properties:
              vendor: { type: string }
              model: { type: ["string", "null"] }
              calls: { type: number }
              providerId: { type: ["string", "null"] }
              benchmarked: { type: boolean }
        # Calls that passed the "who" filters (vertical / assistant /
        # account) or were explicitly picked. Always equals
        # matchedCount + sum(excluded[].count): nothing is dropped silently.
        inScopeCount: { type: number }
        # Exactly the calls createBulk would freeze right now.
        matchedCount: { type: number }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/BulkPreviewExclusion" }
        # null when providerIds is empty -- the count is shown before, and
        # independently of, any cost (T-14).
        estimate:
          oneOf:
            - type: "null"
            - type: object
              required: [sttCostCents, agentCostCents, totalCostCents, overThreshold]
              properties:
                sttCostCents: { type: number }
                # T-35: null = no scan history to project from; "unknown", not $0.
                agentCostCents: { type: ["number", "null"] }
                totalCostCents: { type: number }
                # FR-BLK-5: true means creation would park at
                # awaiting_confirmation instead of launching.
                overThreshold: { type: boolean }
        costThresholdCents: { type: number }
    BulkProviderCorrelation:
      type: object
      required: [bulkId, callCount, providers, pairs, correlatedExcessAgreement]
      properties:
        bulkId: { type: string }
        # Calls with at least one ok transcript in this bulk.
        callCount: { type: number }
        providers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        # Every unordered pair once, providerAId < providerBId.
        pairs:
          type: array
          items:
            type: object
            required: [providerAId, providerBId, sharedCalls, agreement, excessAgreement]
            properties:
              providerAId: { type: string }
              providerBId: { type: string }
              sharedCalls: { type: number }
              # Mean share of aligned words the two agreed on, 0..1. null
              # when they never shared a call -- never a confident 0.
              agreement: { type: ["number", "null"] }
              # agreement minus the average of each side's mean agreement
              # with every other provider (pair excluded). Positive = they
              # agree with each other more than with the field, the mark of
              # a shared engine. null without a third provider.
              excessAgreement: { type: ["number", "null"] }
        # Pairs whose excessAgreement is at or above this are correlated:
        # read their agreement as one vote.
        correlatedExcessAgreement: { type: number }
    BenchmarkTrend:
      type: object
      required: [bulks, cells]
      properties:
        # Bulks with status complete or partial. A running bulk is left out
        # until it settles.
        bulks:
          type: array
          items:
            type: object
            required: [id, name, at, status]
            properties:
              id: { type: string }
              name: { type: string }
              # completedAt, else createdAt -- what the strip orders by.
              at: { type: string, format: date-time }
              status: { type: string }
        cells:
          type: array
          items:
            type: object
            required: [bulkId, accountLabel, assistantId, providerId, providerName, peerFlags, words, callsScored, cleanCalls]
            properties:
              bulkId: { type: string }
              # The client: the Vapi account label on the call. null when
              # the call was never labelled -- shown as its own bucket,
              # never folded into a named client.
              accountLabel: { type: ["string", "null"] }
              assistantId: { type: ["string", "null"] }
              providerId: { type: string }
              providerName: { type: string }
              peerFlags: { type: number }
              words: { type: number }
              callsScored: { type: number }
              cleanCalls: { type: number }
    ClientVolume:
      type: object
      required: [accountId, accountLabel, windowDays, from, to, calls, minutes, truncated, assistants, fetchedAt]
      properties:
        accountId: { type: string }
        accountLabel: { type: string }
        windowDays: { type: number }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        calls: { type: number }
        minutes: { type: number }
        # True when the fetch hit the server's page cap -- read the numbers
        # as "at least".
        truncated: { type: boolean }
        assistants:
          type: array
          items:
            type: object
            required: [assistantId, calls, minutes]
            properties:
              assistantId: { type: ["string", "null"] }
              calls: { type: number }
              minutes: { type: number }
        fetchedAt: { type: string, format: date-time }
    CallDisagreement:
      type: object
      required: [bulkId, calls]
      properties:
        bulkId: { type: ["string", "null"] }
        calls:
          type: array
          items:
            type: object
            required: [callId, disagreements, providers]
            properties:
              callId: { type: string }
              disagreements: { type: number, description: "Sum of peer flag counts across this call's scored providers. Lower is better." }
              providers: { type: number, description: "How many providers had a scored transcript for this call." }
    BulkVerdicts:
      type: object
      required: [bulkId, providers, groups]
      properties:
        bulkId: { type: string }
        providers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [clientLabel, assistantIds, callCount, vertical, production, verdict]
            properties:
              # T-55: one verdict group per CLIENT (the call's Vapi account
              # label), not per assistant -- per-assistant groups were 1-2
              # calls each and could never reach the 5-shared-call floor.
              # null = calls with no account label on file.
              clientLabel: { type: ["string", "null"] }
              # Every assistant whose calls fed this group; null entry = calls
              # imported without a Vapi assistant id. Rankings cards look
              # their assistant up here.
              assistantIds:
                type: array
                items: { type: ["string", "null"] }
              callCount: { type: number }
              vertical: { type: string }
              # Vapi's live transcriber for this group's calls (most common
              # vendor/model), null when no call recorded one.
              production:
                type: ["object", "null"]
                required: [vendor, model, coverage, total]
                properties:
                  vendor: { type: string }
                  model: { type: ["string", "null"] }
                  coverage: { type: number }
                  total: { type: number }
              verdict:
                $ref: "#/components/schemas/HeadlineVerdict"
    HeadlineVerdict:
      type: object
      description: >-
        T-20. Metric is peer flags per 100 words (confidence spans excluded),
        pooled per provider; lower is better. A winner is named only when a
        paired bootstrap (1,000 resamples of the calls the top two both
        scored, seeded) puts zero outside the 95% interval of their rate
        difference. Fewer than 5 shared calls: no noise floor and no winner
        (decision too_few_calls). Every margin ships with evidenceCalls;
        below 20 the whole verdict is provisional.
      required:
        [decision, winnerProviderId, runnerUpProviderId, leaderProviderId, marginPct,
         vsProductionPct, productionProviderId, productionIsLeader, evidenceCalls,
         provisional, callsToSettle, noiseFloor, confidenceComparable, rates, sentence]
      properties:
        decision:
          type: string
          enum: [winner, too_close, too_few_calls, insufficient]
        winnerProviderId: { type: ["string", "null"] }
        runnerUpProviderId: { type: ["string", "null"] }
        # Lowest rate regardless of decision. Never render as the winner
        # unless decision is "winner".
        leaderProviderId: { type: ["string", "null"] }
        # Relative improvement over the runner-up, 0..100. null unless a
        # winner is named.
        marginPct: { type: ["number", "null"] }
        # Same vs the production provider; negative = production cleaner.
        # null when production is unknown, not benchmarked here, or is the
        # leader itself.
        vsProductionPct: { type: ["number", "null"] }
        productionProviderId: { type: ["string", "null"] }
        productionIsLeader: { type: boolean }
        # Distinct calls with at least one flagged cell in this group.
        evidenceCalls: { type: number }
        provisional: { type: boolean }
        # For too_close only: rough shared-call count that would separate
        # the pair at the current gap. null when the gap is zero.
        callsToSettle: { type: ["number", "null"] }
        noiseFloor:
          type: ["object", "null"]
          required: [sharedCalls, difference, ci95, withinNoise]
          properties:
            sharedCalls: { type: number }
            # runner-up rate minus leader rate over shared calls.
            difference: { type: number }
            ci95:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
            withinNoise: { type: boolean }
        confidenceComparable:
          type: object
          required: [reporting, total]
          properties:
            reporting: { type: number }
            total: { type: number }
        rates:
          type: array
          items:
            type: object
            required: [providerId, flagsPer100Words, calls, totalFlags, totalWords]
            properties:
              providerId: { type: string }
              flagsPer100Words: { type: number }
              calls: { type: number }
              totalFlags: { type: number }
              totalWords: { type: number }
        # The verdict as one sentence with its evidence count attached.
        sentence: { type: string }
    BulkProgress:
      type: object
      required: [callsTotal, callsRun, cellsTotal, cellsOk, cellsFailed, cellsPending, cellsCancelled, cellsSkippedPendingReview, agentCallsTotal, agentCallsChecked, agentCallsInFlight]
      properties:
        # FR-BLK-13 structured counts.
        callsTotal: { type: number }
        callsRun: { type: number }
        cellsTotal: { type: number }
        cellsOk: { type: number }
        cellsFailed: { type: number }
        cellsPending: { type: number }
        cellsCancelled: { type: number }
        cellsSkippedPendingReview: { type: number }
        # T-94 (U-15): the agent pass as its own phase. total = calls with an ok
        # transcript; checked = calls whose latest scan finished; inFlight = calls
        # the judge is on right now (this API process only).
        agentCallsTotal: { type: number }
        agentCallsChecked: { type: number }
        agentCallsInFlight: { type: number }
    BulkFailureGroup:
      type: object
      required: [failureClass, cells, retryable]
      properties:
        # T-07 (2026-08-28). One row per distinct failure_class among this
        # bulk's failed cells.
        #
        # `null` is a real group, not a gap: rows written before T-06 added
        # the column carry no class and were deliberately NOT back-guessed
        # by the T-40 migration when their stored error text named no cause.
        # It must stay visible as its own bucket -- folding it into
        # "unknown" would be a claim we cannot support, and "unknown" is
        # retryable while these are not.
        failureClass:
          oneOf:
            - type: string
              enum: [retention_expired, audio_url_forbidden, provider_timeout, provider_5xx, rate_limited, audio_decode, provider_auth, unknown]
            - type: "null"
        cells: { type: number }
        # Decided server-side by isRetryableFailureClass() (the same function
        # the executor would use), so the UI never re-derives the judgement
        # and the two can never disagree. Always false for the null class:
        # an unclassified failure has not been shown to be transient, and
        # re-running it costs real provider money for nothing.
        retryable: { type: boolean }
    BulkShardRun:
      type: object
      required: [id, shardIndex, status, callCount, createdAt]
      properties:
        id: { type: string }
        shardIndex: { type: number }
        status: { $ref: "#/components/schemas/RunStatus" }
        callCount: { type: number }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    BulkDetail:
      allOf:
        - $ref: "#/components/schemas/Bulk"
        - type: object
          required: [progress, runs, actualCost, failureBreakdown]
          properties:
            progress: { $ref: "#/components/schemas/BulkProgress" }
            runs:
              type: array
              items: { $ref: "#/components/schemas/BulkShardRun" }
            actualCost: { $ref: "#/components/schemas/BulkActualCost" }
            # T-07: what progress.cellsFailed is actually made of. Empty
            # array when nothing failed; the group counts always sum to
            # progress.cellsFailed.
            failureBreakdown:
              type: array
              items: { $ref: "#/components/schemas/BulkFailureGroup" }
    BulkActualCost:
      type: object
      required: [sttCostMicrocents, agentCostMicrocents, agentCallsChecked, agentCallsFlagged, agentCallsResolved, agentCallsErrored, agentCallsJudged]
      properties:
        # Real spend, summed from benchmark_scores.cost_microcents /
        # benchmark_agent_scans.judge_cost_microcents for this bulk's calls --
        # never combined into one number (STT and OpenAI agent spend are
        # different budgets to a person deciding whether to keep running
        # this).
        #
        # T-01 (2026-08-28): MICRO-CENTS, not cents (1 cent = 10,000
        # microcents). Both underlying columns were integer cents, which
        # rounded a real judge call (0.4905c) to a failed insert and a real
        # STT cell (~0.92c) to 1c. Divide by 10,000 to display; never render
        # a rounded 0 as if it were a measured 0.
        sttCostMicrocents: { type: number }
        # T-03 (2026-08-28): NULLABLE, and null is not zero. null means judge
        # calls ran but no cost survived to be stored -- OpenAI was paid and
        # we cannot say how much; render "not recorded", never "$0.00". A
        # literal 0 is only sent when nothing was flagged or errored, so no
        # judge call was ever made.
        agentCostMicrocents: { type: number, nullable: true }
        # Coverage evidence that the auto-verification pass actually ran,
        # not just claimed to: how many calls got a scan, how many were
        # flagged by the free hybrid pass, how many of those got a real
        # OpenAI judge call (judged can be < flagged if the judge call
        # itself errored -- see benchmark_agent_scans.status "error").
        # T-03 (2026-08-28): flagged and errored are separate counts and must
        # never be added together. flagged = the check ran and found
        # something. errored = the check did not complete, so nothing is
        # known about that call. checked = flagged + resolved + errored + clean.
        # T-38: resolved = flagged scans a human has since approved or
        # rejected -- work done, not an open finding, not a gap.
        # T-34: judged = the judge's reasoning is on the row, regardless of
        # whether its cost is known.
        agentCallsChecked: { type: number }
        agentCallsFlagged: { type: number }
        agentCallsResolved: { type: number }
        agentCallsErrored: { type: number }
        agentCallsJudged: { type: number }
    BulkTemplate:
      type: object
      required: [id, name, selectionCriteria, providerIds, shardSize, minDurationSeconds, maxDurationSeconds, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        selectionCriteria: { $ref: "#/components/schemas/BulkSelectionCriteria" }
        providerIds:
          type: array
          items: { type: string }
        shardSize: { type: number }
        minDurationSeconds: { type: number }
        maxDurationSeconds: { type: ["number", "null"] }
        createdByLabel: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BulkTemplateInput:
      type: object
      required: [name, criteria, providerIds]
      properties:
        name: { type: string, minLength: 1 }
        criteria: { $ref: "#/components/schemas/BulkSelectionCriteria" }
        providerIds:
          type: array
          minItems: 1
          items: { type: string }
        shardSize: { type: number, minimum: 1, maximum: 500 }
        minDurationSeconds: { type: number, minimum: 0 }
        maxDurationSeconds: { type: ["number", "null"], minimum: 0 }
    BulkTemplateLaunchInput:
      type: object
      properties:
        # Override the auto-generated bulk name (default: template name + date).
        name: { type: string, minLength: 1 }
        confirm: { type: boolean }
    RunManifestCall:
      type: object
      required: [id, label, goldTranscriptSha256]
      properties:
        id: { type: string }
        label: { type: string }
        goldTranscriptSha256: { type: ["string", "null"] }
    RunManifestProvider:
      type: object
      required: [id, name, model, configSha256]
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        configSha256: { type: string }
    RunManifest:
      type: object
      required: [manifestVersion, runId, scoringVersion, createdAt, calls, providers]
      properties:
        manifestVersion: { type: number }
        runId: { type: string }
        scoringVersion: { type: string }
        createdAt: { type: string, format: date-time }
        calls:
          type: array
          items: { $ref: "#/components/schemas/RunManifestCall" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/RunManifestProvider" }
    BulkManifest:
      type: object
      required: [manifestVersion, bulkId, name, status, selectionCriteria, providerIds, shardSize, createdAt, runs]
      properties:
        manifestVersion: { type: number }
        bulkId: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/BulkStatus" }
        selectionCriteria: { $ref: "#/components/schemas/BulkSelectionCriteria" }
        providerIds:
          type: array
          items: { type: string }
        shardSize: { type: number }
        createdAt: { type: string, format: date-time }
        runs:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RunManifest"
              - type: object
                properties:
                  shardIndex: { type: ["number", "null"] }
                  runStatus: { $ref: "#/components/schemas/RunStatus" }